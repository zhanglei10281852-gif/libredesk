rubrics:
  - id: 1
    type: f2p
    text: "合法更新只有在候选 channel 对象和接收资源可用后才返回成功，随后数据库配置与唯一 active runtime 使用同一配置代际。"
  - id: 2
    type: f2p
    text: "候选解析、连接资源创建或初始化失败时，API 返回明确错误，数据库配置、别名和保留密码仍为旧值，旧发送对象与旧接收器继续工作。"
  - id: 3
    type: f2p
    text: "同一收件箱的并发更新按代际串行发布；较旧候选即使更晚完成也不能覆盖较新提交，并会正确释放自己的资源。"
  - id: 4
    type: f2p
    text: "成功切换在一个受控交接点停止旧接收器、发布候选并启动新接收器，不会让两个接收器并行消费；失败切换不会造成接收空窗或 Manager.Get 暂时找不到原收件箱。"
  - id: 5
    type: f2p
    text: "邮件、在线聊天和 WhatsApp 的失败候选、被替换旧对象、禁用对象及删除对象均按各自所有权关闭资源且不重复关闭，不遗留 goroutine、连接或池。"
  - id: 6
    type: p2p
    text: "禁用和删除仍会有意移除运行时，重新启用只启动一个接收器；创建和普通更新的现有权限、校验与错误响应保持兼容。"
  - id: 7
    type: p2p
    text: "认证错误展示、密码空值保留、邮件别名状态和 WhatsApp ingester 的既有保存后行为不因代际切换而回归。"
